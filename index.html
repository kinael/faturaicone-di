<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aviso — Site descontinuado</title>
  <link rel="icon" href="https://i.imgur.com/Cq8GtlD.png">
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --accent:#f59e0b; --link:#60a5fa; }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:radial-gradient(1200px 800px at 50% -10%, #1f2937 0%, var(--bg) 60%);color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{min-height:100%;display:grid;place-items:center;padding:24px}
    .card{width:100%;max-width:720px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));backdrop-filter:blur(6px);
      border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
    .img{display:block;width:140px;height:auto;margin:0 auto 16px auto;filter:drop-shadow(0 6px 18px rgba(245,158,11,.35))}
    h1{margin:0 0 12px;font-size:clamp(28px,5vw,40px);letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
    p{margin:0 auto;font-size:clamp(16px,2.5vw,18px);line-height:1.6;color:var(--text);max-width:58ch}
    .muted{color:var(--muted)}
    .link{color:var(--link);text-decoration:none;border-bottom:1px dashed rgba(96,165,250,.6)}
    .link:hover{text-decoration:underline}
    .btn{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:10px;background:#0b5acc20;border:1px solid rgba(96,165,250,.4);
      color:var(--text);text-decoration:none;font-weight:600;transition:transform .08s ease, background .2s ease}
    .btn:hover{transform:translateY(-1px)}
    footer{margin-top:14px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main" aria-labelledby="titulo">
      <img
        class="img"
        src="https://static.vecteezy.com/system/resources/thumbnails/022/417/243/small/3d-illustration-hand-holding-warning-sign-png.png"
        alt="Ícone de aviso: mão segurando placa de alerta" loading="eager" decoding="async"
      />
      <h1 id="titulo">atenção!</h1>
      <p>
        Este site foi <strong>descontinuado</strong>. Para acessar o
        <strong>protótipo atualizado</strong>, entre no link:
        <a id="link-prototipo" class="link" href="https://kinael.github.io/fatura-di" target="_blank" rel="noopener noreferrer">
          kinael.github.io/fatura-di
        </a>.
      </p>
      <a id="btn-prototipo" class="btn" href="https://kinael.github.io/fatura-di" target="_blank" rel="noopener noreferrer">
        Abrir protótipo atualizado
      </a>
      <footer class="muted">Qualquer dúvida, enviar e-mail para wrubly@outlook.com</footer>
    </main>
  </div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxXNXMMFhOtV0ce3tln4zSxeuTnS-CHpCcaKhlRXwWWd8uFPdLtt_s5LNxsozM7tbznuA/exec";
  const payload = { message: "Nova consulta realizada." };

  function notify(event) {
    const url = event.currentTarget.getAttribute('href');

    try {
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      if (navigator.sendBeacon) navigator.sendBeacon(WEB_APP_URL, blob);
    } catch(e) {}

    try {
      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(()=>{});
    } catch(e) {}

    try {
      const img = new Image();
      img.src = WEB_APP_URL + "?t=" + Date.now();
    } catch(e) {}


  }

  document.getElementById('link-prototipo').addEventListener('click', notify);
  document.getElementById('btn-prototipo').addEventListener('click', notify);
</script>


</body>
</html>
